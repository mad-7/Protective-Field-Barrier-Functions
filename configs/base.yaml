  # Re-pinned 2026-10-25 within re-freeze 10, before its bit-identity run (was be0a5e16...): stale
  # docstrings corrected in nav_env.py, observation.py, robot.py and pfb.py; no code changed.
  # RE-FROZEN 2026-10-26, eleventh time (was bd3f8878...): the rulings of 2026-10-26 -- the PFB's
  # rows over the realised motion fraction, its field's partials path corrected to the certified
  # field, and its exact speed-ups (pfb.py, pfb_field.py); latched steps excluded from the
  # intervention term (reward.py, nav_env.py); the nominal-share descriptions (robot.py,
  # step_loop.py). Filter-off behaviour unchanged (the term was already 0 without the filter); the
  # filter-off bit-identity test reruns and must show L1 unaffected.
  # RE-FROZEN 2026-10-27, twelfth time (was b0ec422c...): the rulings of 2026-10-27 -- the shared
  # invalid-bin convention (pfbnav/safety/unobserved.py, new in the closure; pfb.py enters an
  # unobserved bin into its rows as an obstacle on the footprint's boundary -- the command is the
  # same fallback as before, still labelled "unobserved", now counted in PFBResult.unobserved), and
  # the PFB's per-step compute and unobserved count in the step info (step_loop.py, nav_env.py:
  # `pfb_seconds`, `pfb["unobserved"]`; information only) for the real-time criterion. Off, the PFB
  # is not built: filter-off behaviour unchanged. The filter-off bit-identity test reruns. No L1 run
  # exists.
  # RE-FROZEN 2026-10-29, thirteenth time (was d7cd5e3a...): A29, a blocking defect -- the restart
  # check sized the departure field from the raw request and raised above the top band (G2's first
  # run, a random action at 0.549 m/s); it now uses min(|request|, speed_cap) (certified.py). Within
  # the cap nothing changes. The filter-off bit-identity test reruns. No L1 run exists.
  frozen_code_sha256: 3757aeca1753a015cc26bb106955d33d0dcf2a70af21425fcf435362b5294cb6

  # The step-0 check (2026-10-10): at every reset the robot's measured pose, mapped into the
  # layout, must equal the scenario's start within these, or the reset raises. Settling moves the
  # robot ~0.1 mm; the stale-pose bug these exist to catch put it up to 7.2 m away. Not physical
  # constants of the robot: a detector's thresholds, set two orders above the noise.
  start_pose_tolerance_m: 0.01     # m
  start_pose_tolerance_rad: 0.01   # rad
  # Per-step wall-clock budget. What binds is the AGGREGATE over the instances on the
  # training host (>= 25 steps/s, derived in docs/requirements.md from ~20M total steps
  # against the 6-week window); the per-instance, per-step figure follows from it and the
  # instance count and is computed in pfbnav/eval/step_budget.py, never written down:
  #   per-step p95 budget = instances / aggregate_steps_per_s  (0.160 s at 4 instances)
  # The 40 ms that stood here until 2026-09-23 came from the >= 100 steps/s target that was
  # withdrawn as an arithmetic error (2026-09-20).
  observation:             # the 82-D layout ruled 2026-09-23 (docs/decision_log.md).
                           #   Channels and order live in pfbnav/envs/observation.py; only
                           #   the scales that are not already physical parameters are here.
    goal_scale: 18.0       # m, what the goal-distance channel divides by, clipped at 1.
                           #   The hall's diagonal is hypot(14, 10) = 17.2 m, so a goal
                           #   anywhere in it stays below 1 and distant goals stay
                           #   distinguishable. VERIFY: a scaling choice, not a measurement.
    proximity_threshold: 0.5   # m, where the (currently unused) proximity term reaches 0.
                           #   reward.k_proximity is 0 except in the shaped variants.
    # Sensor dropout, the declared augmentation, TRAINING only and never applied to the
    # filter's 120-bin stream: the certified layer and the PFB must see the sensor the robot
    # really has, or the safety layers measure better than they are. Mechanism ruled by the
    # supervisor on 2026-09-26, replacing the flat per-bin rate of 2026-09-23.
    # Preregistered before any policy trains; a training config may not vary it per method.
    dropout:
      arc_probability: 0.10  # P(an episode begins with a blocked arc), held all episode.
                           #   The failure that matters -- a smeared lens, tape, a mount that
                           #   sees the payload -- and one a policy cannot average away over a
                           #   few steps the way it can with per-step noise.
      arc_bins: [1, 6]     # contiguous policy bins blinded, inclusive; 10 deg each, so 10-60
                           #   deg of the ring. The arc wraps: bin 0 is not a boundary.
      per_step_rate: 0.01  # per bin, per step, so the validity channels move in EVERY
                           #   episode and not only in the sampled ones.
                           # A dropped bin reads range 0.0, never range_max: range_max is
                           #   unobserved space presented as free, which hard rule 5 forbids.
  step_budget:
    aggregate_steps_per_s: 25    # steps/s summed over instances, on the TRAINING host.
                                 #   VERIFY: still to be committed to preregistration as
                                 #   G2_compute_budget.min_steps_per_second before G2 runs.
    instances: 4                 # planned parallelism; G2 measures 1..4 (gates.yaml)
    over_budget_is_fatal: false  # a step over budget is counted and logged, never fatal:
                                 #   the budget is a compute requirement, not a safety one,
                                 #   and a laptop figure is not the training host's

training:
  algo: sac
  total_timesteps: 300000  # fixed after gate G2
  learning_rate: 3.0e-4
  buffer_size: 200000
  learning_starts: 2000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1            # environment steps between updates; with gradient_steps 1 this is
  gradient_steps: 1        #   one update per step, the 7.5M updates docs/requirements.md budgets
  ent_coef: auto           # SAC's learned temperature (SB3 default)                    VERIFY
  net_arch: [256, 256]     # hidden layers of actor and critics (SB3 default)           VERIFY
  device: cuda             # RULED 2026-10-29: every learned arm and seed on the GPU, no mixing;
                           #   never `auto` (a host without CUDA is refused, not run on the CPU).
                           #   Training is statistically, not bit-for-bit, reproducible;
                           #   provenance records device, driver, CUDA and cuDNN
  checkpoint_every: 25000  # steps between checkpoints; never overwritten (hard rule 10)
  scenarios:               # the training set, ruled 2026-10-03: equal thirds by stratum, ~2,000,
    - scenarios/train/train_narrow.json   # train seed range, rate 0.25. Built by
    - scenarios/train/train_medium.json   #   scripts/build_scenario_sets.py once its size is
    - scenarios/train/train_wide.json     #   preregistered; train.py refuses until they exist
