  # filter-off bit-identity test reruns on the simulator. No L1 run exists.
  # RE-FROZEN 2026-10-16 again (was 645358f2...): the classical-recovery rulings -- the outcome
  # labelling fix (reward.py: stuck also when at rest with the own field breached) and the typed
  # controller input built beside the observation (nav_env.py, envs/controller_input.py,
  # envs/route_view.py; information only). certified.py and lookahead.py are untouched (both sit
  # in the scenario identity's closure, A18). The filter-off bit-identity test reruns on the
  # simulator. No L1 run exists.
  # RE-FROZEN 2026-10-16, third time (was 564802d8...): the rotation-aware protective field
  # (certified.py: the stopping sweep includes yaw braking at the current yaw rate, alpha_brake =
  # actuation.alpha_max; strata.py passes it). Bit-identical at zero yaw rate (stored fields).
  # The filter-off bit-identity test reruns on the simulator. No L1 run exists.
  # RE-FROZEN 2026-10-16, fourth time (was ff14176d...): the field is never sized below true
  # motion -- band from max(estimate, applied command), rotation sweep from the larger yaw rate
  # (certified.py, step_loop.py) -- and the validity oracle's rotation sweep (route_check.py,
  # oracle.py, scenarios.py). The filter-off bit-identity test reruns on the simulator.
  # ... and the rotation sweep made EXACT and continuous in the yaw rate (2026-10-16,
