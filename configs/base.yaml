# Base configuration (v2). All physical quantities in SI units.
# Values marked VERIFY must be checked against the scene model in WP0.

host:
  # Which machine this is, for runs to be read against: timings are a property of the host, not of the method
  shared: false  # true when the machine is shared with other load during a run

sim:
  endpoint: "tcp://127.0.0.1"
  port: 23000  # instance i listens on port + port_stride * i
  port_stride: 2  # 23000, 23002, 23004, 23006: the researcher's launch ports, spaced so an add-on that opens a second port beside its own cannot
  dt: 0.05  # s, physics step (20 Hz)
  display_enabled: false  # rendering costs ~7 ms of a ~27 ms step and changes no physics
  reply_timeout_s: 120.0  # s, the longest one remote call may wait for its reply before SimError (pfbnav/sim/client.py).
  scene: "scenes/warehouse_v2.ttt"
  scene_sha256: "537f1bbbb7d674a395107398b46b7b6a765428b2942acefd529bf0c24dc35eb4"
                           # the committed scene: /Wall removed and the floor 7 x 7 tiles
  floor_half_extent_m: 17.5  # m, the scene's floor is [-h, h]^2: 7 x 7 tiles of 5 m (ruled 2026-10-10; was 7.5, nine tiles, which halls overhung by up to 7 m).
  robot_spawn_radius_m: 0.01  # m, bound on the robot's scene pose's distance from the origin
  physics:  # FROZEN 2026-09-18 by the D7 probe
    engine: 1  # 0 Bullet, 1 ODE, 2 Vortex, 3 Newton, 4 MuJoCo.
    dynamic_step: 0.005  # s, dynamics substep.
    solver_sensitivity_drift_deg: 0.64  # deg, spread of lateral drift across those three steps
  objects:  # scene object paths, resolved with sim.getObject
    base_ref: "/youBot/youBot_ref"  # pose + velocity reference frame (confirmed 09-17)
    chassis: "/youBot"  # chassis shape: contact and bbox (confirmed 09-17)
    robot_tree: "/youBot"  # model root, excluded from obstacles (confirmed 09-17)
    floor: "/floor"  # excluded from the wheels' obstacle set (confirmed 09-17)
    wheels:  # order [fl, fr, rl, rr]
      # 2026-09-17: the front wheels hang off the passive front-axle joint /youBot/Joint, not off the model root.
      - "/youBot/Joint/Rectangle0/rollingJoint_fl"
      - "/youBot/Joint/Rectangle0/rollingJoint_fr"
      - "/youBot/rollingJoint_rl"
      - "/youBot/rollingJoint_rr"

robot:
  # Robot envelope: the half-extents of everything that can strike an obstacle -- the chassis, the wheels and the sensor pods.
  half_length: 0.2854  # m, set by the CHASSIS, not by a scanner: with the S300 layout (scene 0ae35a50) the scanners sit on the diagonal corners and reach
  half_width: 0.2086  # m, D8 2026-09-18: set by the hidden wheel spheres (wheel_respondable_*), collidable since ruling 1. Upper bound of the probe
  wheel_radius: 0.05  # m
  half_wheelbase: 0.228  # m, measured 2026-09-17 from the wheel joint positions
  half_track: 0.1585  # m, measured 2026-09-17 (left 0.1585, right 0.1586; the 0.1 mm asymmetry is below anything that matters here)
  wheel_sign: [-1, -1, -1, -1]  # per-wheel sign vector, measured 2026-09-17 by gate G0: with [1,1,1,1] the robot ran backwards on both translation axes
  # D8: the measured footprint, e(psi) per whole degree with a periodic spline (pfbnav/safety/footprint_table.py), built
  footprint_table: "configs/footprint/youbot_envelope_1deg.csv"
  yaw_offset: 1.5707963  # rad (= pi/2), rotation from base_ref +x to chassis forward measured 2026-09-17: the /youBot frame is X-up and base_ref is

actuation:
  mode: holonomic  # holonomic | unicycle
  v_max: 0.5  # m/s, forward/backward.
  vy_max: 0.5  # m/s, lateral.
  w_max: 1.5  # rad/s
  a_max: 0.5  # m/s^2, commanded acceleration limit. VERIFY
  alpha_max: 1.4  # rad/s^2, yaw acceleration limit. VERIFY
  # D9: the limiter bounds deceleration separately, so no controller can command a stop faster than the PFB's stopping-distance model
  a_decel_max: 1.0  # m/s^2, deceleration limit
  # Ruling 2 (WP0 results report): the mecanum wheel-speed budget |vx| + |vy| + (l+w)|wz| <= fraction * v_rim, which is exactly
  wheel_budget:
    v_rim: 0.617  # m/s VERIFY: 12.34 rad/s * 0.05 m, measured in G1-ODE on the saturating diagonal.
    nominal_fraction: 0.80  # 0.494 m/s at the fastest rim: planning only (the oracle schedule and the route cap), never enforced on a command
    filter_fraction: 0.95  # the enforced share, for every method: 0.586 m/s

estimation:
  # Ruling 4 (WP0 results report): the safety layers use the estimated *actual* body velocity -- filtered pose differencing
  velocity:
    filter_tau: 0.10  # s, first-order low-pass VERIFY
    latency_steps: 0  # WP2 sensitivity check sets 1 (declared, not tuned)
    noise_std: [0.0, 0.0, 0.0]  # m/s, m/s, rad/s

scanners:
  policy_bins: 36  # observation stream (360 deg)
  plausibility:  # RULED 2026-10-23, the scan-fault fix (pfbnav/sim/scan_guard.py)
    neighbour_bins: 2  # bins either side of the last accepted scan a range may come from (one step of rotation at w_max is 1.4 bins of 3 deg)
    range_tolerance_m: 0.06  # m, one step of translation at the top speed (0.025) plus noise
    corrupt_bins: 6  # bins outside the bound that make a packet implausible
    rerenders: 2  # re-renders of the same tick before the fail-safe
  filter_bins: 120  # filter stream, with exact bearings
  range_max: 5.0  # m
  range_min: 0.05  # m, self-filter beyond footprint
  # How a vision sensor's depth pixel becomes a point (pfbnav/sim/depth_geometry.py). VERIFY
  pixel_mirror: true  # pixel 0 lies towards the sensor's +x (mirrored order)
  rays_per_degree: 4.2666667  # rays per degree of each sensor's field of view. VERIFY
  coverage_depth: 1.0  # m beyond the footprint edge over which a bin must be observed end to end to count as valid (pfbnav/sim/coverage.py).
  self_filter_margin: 0.005  # m
  depth_is_euclidean: false  # depth is perpendicular, along the sensor's +z

filter:  # the PFB (WP2, ruled 2026-10-23).
  enabled: false
  alpha: 1.0  # 1/s, class-K gain.
  alpha_frozen: "2026-11-03"  # the freeze's ruling
  lag_allowance_s: 0.05  # s, added to one control step to make the prediction horizon (Q2) VERIFY
  motion_fractions: [0.0, 0.25, 0.5, 0.75, 1.0]  # the realised fraction lambda of the predicted motion over dt + lag that every barrier row must hold over
  motion_grid_margin_m: 0.0005  # m subtracted from every row, so the 5-point grid's minimum is a LOWER bound of the minimum over all lambda: the measured gap,
  binning_penalty_m: 0.0005  # m, the measured scan residual at its upper bound (Q6; -0.27..+0.50 mm, TRAVERSABILITY_20260927T222532Z), not the derived
  creep_fraction: 0.9  # the creep regime: 0.9 x the standstill exits (as the recovery's creep)
  row_window_m: 0.5  # m, rows with more linearised slack than this are left out of the QP (every TRUE row is still checked at the solution)
  linearisations: 2  # the first about u_nom, and one re-linearisation (Q3)
  linearisation_margin_m: 0.0005  # m, the linearised rows are tightened by 0.5 mm
  yaw_trust_rad_s: 0.05  # rad/s, per linearisation the yaw rate stays within this of its point and the rows are CHORDS there: the field is convex in |w| VERIFY
  band_speed_margin_m_s: 0.002  # m/s kept below each band's speed limit: an estimate a hair above the command at the limit tipped the certified layer into VERIFY
  qp_solver: clarabel  # interior point

certified:  # certified-layer emulator (always on)
  enabled: true
  response_time: 0.10  # s
  a_brake: 1.0  # m/s^2
  restart_delay: 2.0  # s
  n_field_sets: 3  # discrete speed bands
  band_top_speeds: [0.10, 0.30, 0.51]  # m/s, A20 (ruled 2026-10-18): bands INDEXED BY REACHABLE SPEED, v + a_max T capped by the box and the wheel budget. VERIFY
  # Field shape (WP1 report, ruling 2 as corrected): the Minkowski sum of the footprint with the braking segment along the travel
  margin: 0.10  # m, AHEAD when moving, and only ahead.
  lateral_margin: 0.05  # m, abeam of the travel direction when moving -- and the AT-REST margin all round. VERIFY
  # The WARNING field, the emulator's own rather than "the field of the band above" (supervisor 2026-09-26). VERIFY
  warning_scale: 1.5  # x the protective stopping depth VERIFY
  warning_extra: 0.05  # m, the extension AHEAD (depth and margin) VERIFY
  warning_extra_abeam: 0.02  # m, the extension abeam, behind and at rest VERIFY Ruled 2026-09-28 (D2).
  standstill_enter: 0.01  # m/s, at or below this a moving robot comes to rest VERIFY
  standstill_exit: 0.02  # m/s, above this a resting robot is moving VERIFY
  # rad/s, the same thresholds for ROTATION VERIFY
  standstill_yaw_enter: 0.0296
  standstill_yaw_exit: 0.0592  # rounded DOWN from 0.05927, so the robot leaves rest no later Hysteresis, lower entry and higher exit, so an estimate near one

reward:
  k_progress: 5.0
  time_cost: 0.01
  k_stop: 5.0
  k_intervention: 0.1
  k_proximity: 0.0  # > 0 only for the shaped variants (L1, L4), and then EXACTLY the derived value of `shaping` below
  shaping:  # RULED 2026-11-01: k_proximity such that, on the centreline of the narrowest aisle stratum at reference_speed, the proximity
    proximity_share: 0.25  # 1, a DECLARED DESIGN CHOICE (ruled), not a measurement
    reference_speed: 0.3  # m/s
    reference_stratum: narrow  # its min_clearance (world.aisle_strata) is the narrowest aisle
  goal_bonus: 200.0
  contact_penalty: 200.0
  goal_tolerance: 0.25  # m
  max_steps: 4000  # steps (200 s at dt 0.05).
  horizon_margin: 1.3  # x the schedule time the horizon must cover: emulated completions ran 1.12-1.25 x their schedules on eight tune routes (2026-10-20)

tracking:  # proportional path tracker used by gate G1b (D6).
  k_cross_track: 1.0  # 1/s, lateral velocity per metre of cross-track error VERIFY
  k_heading: 2.0  # 1/s, yaw rate per radian of heading error VERIFY First estimates, never run.

world:
  set_verification:  # RULED 2026-10-29 (scripts/compare_rebuilt_sets.py)
    float_abs_tol_m: 1.0e-9  # m, recorded floats of a rebuilt set
  # D2: aisle strata by PER-SIDE clearance (robot centred, aligned), not by aisle width.
  narrow_floor_slack: 0.03
  layout:  # what the generator builds (WP1, option 1 of 2026-09-23): polygons, baked into the planner's map and instantiated into the fixed
    bounds: [0.0, 0.0, 14.0, 10.0]  # m, (x_min, y_min, x_max, y_max) of the hall
    wall_thickness: 0.2  # m, the perimeter
    shelf_depth: 0.8  # m across the aisle (a pallet rack is ~0.8-1.2 m deep)
    shelf_height: 1.6  # m, well above the 0.221 m scan plane, so a shelf is sensed at scanner height and not merely present
    wall_height: 1.6  # m, the perimeter
    shelf_length_fraction: [0.70, 0.92]  # of the usable span along the aisle, sampled per row.
    rows: [2, 4]  # how many shelf rows a layout has, inclusive
    end_clearance: 1.2  # m kept clear at each end of a row, so the robot can turn out
    min_aisle_travel: 1.5  # m of the planned route that must lie BETWEEN two shelf rows for a scenario to be kept.
    validity:  # ruled 2026-10-15: every built route must be traversable by the free-orientation oracle (pfbnav/world/oracle.py, route_validity)
      sample_spacing_m: 0.02  # m between checked poses along the route
      yaw_step_deg: 15  # deg, the body-yaw grid
      heading_round_deg: 1.0  # deg, field shapes shared across routes (lead term < 1 mm)
      coarse_stride: 16  # the exact coarse-first separating-axis test
      goal_resamples: 8  # goal re-draws for one start before the next endpoint pair
      yaw_rate_step: 0.05  # rad/s: the rotation sweep's yaw rate (tangent tracking at band 0's top speed, the turn taken over planner.lookahead) is rounded
    unmapped:  # obstacles the planner is NOT told about (rate preregistered)
      size: [0.25, 0.60]  # m, square footprint sampled in this range (pallet, cage, bin)
      height: 0.80  # m: above the scan plane, so an unmapped obstacle is SENSED even though it is not mapped.
      count: [1, 2]  # how many, when an episode has any
      margin: 0.15  # m kept between an unmapped obstacle and any shelf or wall, so it never merges into geometry the planner already knows
      min_arc_from_start: 2.0  # m along the plan before an unmapped obstacle may appear.
      min_distance_to_goal: 1.0  # m, so an unmapped obstacle cannot sit on the goal and make an episode unwinnable rather than difficult
      # ROUTE-RELATIVE placement, every split (A13, supervisor 2026-09-29).
      route_relative:
        offset_max: 0.6  # m, to the nearest surface, as ruled
        first_offset_max: 0.3  # m, the FIRST obstacle's cap (ruled 2026-09-30, option a): every scenario then has a surface within 0.3 m of the route.
        arc_to_goal: 1.0  # m of route arc excluded at the goal, as ruled
        attempts_per_obstacle: 200  # re-samples of ONE obstacle before its route is given up
        bypass:  # ruled 2026-10-02 (pfbnav/world/bypass.py).
          corridor_half_width: 1.0  # m, W: local avoidance within the route's corridor.
          resolution: 0.01  # m, the check grid. VERIFY
  aisle_strata:  # m per side.
    # S2 (ruled 2026-10-19): the moving fields nest -- with the coupling term the nesting test showed necessary
    - {name: narrow, min_clearance: 0.1987, max_clearance: 0.2687}
    - {name: medium, min_clearance: 0.2687, max_clearance: 0.40}
    - {name: wide,   min_clearance: 0.40, max_clearance: 0.80}

evaluation:  # RULED 2026-10-23
  ring_steps: 200  # steps (10 s) of per-step trace every evaluation keeps, dumped on stationary triggers, contacts and unrecoverable stops

baseline_files:       # parameters of B1, B2, B3, B6 and the shared recovery / route cap
  - baselines/B1_pure_pursuit.yaml
  - baselines/B2_regulated_pure_pursuit.yaml
  - baselines/B3_dwa.yaml
  - baselines/B6_field_aware_mppi.yaml
  - baselines/shared.yaml

baselines:  # the classical comparators (WP3).
  ideal_tracker:  # WP2 (2026-10-23): the PFB acceptance step's nominal controller -- tangent tracking of the planned route, blind to the scan
    cruise_speed: 0.5  # m/s, about the top speed, so every slow-down is the PFB's
    k_cross: 1.0  # 1/s, lateral velocity toward the route per metre of cross-track
    k_yaw: 1.5  # 1/s, yaw rate per radian of heading error to the tangent
    goal_slowdown: 0.5  # m, linear slow-down to the goal
  oracle_tracker:  # RULED 2026-10-20 (pre-declared 2026-10-17): G4's PRIVILEGED positive control.
    k_cross: 1.0  # 1/s, lateral velocity toward the route per metre of cross-track
    k_yaw: 2.0  # 1/s, yaw rate per radian of yaw error to the schedule
    yaw_rate_ladder: [0.20, 0.15, 0.10, 0.05]  # rad/s.
    yaw_tolerance_rad: 0.05  # rad: where the schedule's speed is below min_speed, rotate in place until the yaw is within this
    min_speed: 0.018  # m/s, the creep speed (0.9 x the standstill exit): where the schedule's speed tends to zero the tracker creeps, at rest's field
planner:
  resolution: 0.05  # m/cell
  # Two-tier inflation (D1, supervisor review 2026-09-17).
  lethal_margin: 0.10  # m, added to the inscribed radius (0.2086 -> 0.3086).
  soft_margin: 0.03  # m, added to the circumscribed radius
  lookahead: 0.8  # m, how far along the plan the tracked waypoint sits.
  track_window: 1.0  # m of arc length the tracker will search ahead of where it already is.
  soft_weight: 1.0  # how much the soft tier costs the search: a move into a cell of soft cost c costs length * (1 + soft_weight * c), so at 1.0 a cell VERIFY

env:  # the Gymnasium environment (WP1)
  # The step-0 check (2026-10-10): at every reset the robot's measured pose, mapped into the layout, must equal the scenario's start
  start_pose_tolerance_m: 0.01  # m
  start_pose_tolerance_rad: 0.01  # rad
  # Per-step wall-clock budget.
  observation:  # the 82-D layout ruled 2026-09-23 (docs/decision_log.md).
    goal_scale: 18.0  # m, what the goal-distance channel divides by, clipped at 1. The hall's diagonal is hypot(14, 10) = 17.2 m, so a goal anywhere VERIFY
    proximity_threshold: 0.5  # m, where the (currently unused) proximity term reaches 0. reward.k_proximity is 0 except in the shaped variants.
    # Sensor dropout, the declared augmentation, TRAINING only and never applied to the filter's 120-bin stream: the certified layer
    dropout:
      arc_probability: 0.10  # P(an episode begins with a blocked arc), held all episode.
      arc_bins: [1, 6]  # contiguous policy bins blinded, inclusive
      per_step_rate: 0.01  # per bin, per step, so the validity channels move in EVERY episode and not only in the sampled ones.
  step_budget:
    aggregate_steps_per_s: 25  # steps/s summed over instances, on the TRAINING host. VERIFY
    instances: 4  # planned parallelism
    over_budget_is_fatal: false  # a step over budget is counted and logged, never fatal: the budget is a compute requirement, not a safety one, and a laptop figure

training:
  algo: sac
  total_timesteps: 2000000  # RULED 2026-10-30 (A30), identical for every learned method: was 300000
  curriculum:  # RULED 2026-10-30 (A30), identical for every learned arm
    - {name: wide_medium_mapped, from_fraction: 0.0, strata: [wide, medium], unmapped: false}
    - {name: all_strata_mapped, from_fraction: 0.2, strata: [narrow, medium, wide], unmapped: false}
    - {name: full, from_fraction: 0.4, strata: [narrow, medium, wide], unmapped: true}
  stall_truncation:  # RULED 2026-10-30 (A30): TRAINING only (pfbnav/training/stall.py)
    window_s: 30.0  # s
    min_progress_m: 0.05  # m of route arc length
  episode_stats_window: 50  # episodes in the rolling window of the TensorBoard episode statistics (pfbnav/training/tb_stats.py); reads only, changes nothing learned
  memory_sample_every: 1000  # steps between in-run memory samples (memory_trend.jsonl), ruled 2026-10-30: the trend is in every training run, GPU memory
  memory_alarm_mb: 1024.0  # MB
  memory_check:  # the declared criterion for the ~100k-step check (ruled 2026-10-30)
    total_timesteps: 100000
    settled_from: 3000  # step
    mark_fraction: 0.10  # "levels off within the first 10 % of the run"
    max_growth_mb: 100.0  # MB, the training process's growth from the mark to the end.
  learning_rate: 3.0e-4
  buffer_size: 200000
  learning_starts: 2000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1  # environment steps between updates
  gradient_steps: 1  # one update per step, the 7.5M updates docs/requirements.md budgets
  ent_coef: auto  # SAC's learned temperature (SB3 default) VERIFY
  net_arch: [256, 256]  # hidden layers of actor and critics (SB3 default) VERIFY
  device: cuda  # RULED 2026-10-29: every learned arm and seed on the GPU, no mixing
  checkpoint_every: 25000  # steps between checkpoints
  scenarios:  # the training set, ruled 2026-10-03: equal thirds by stratum, ~2,000,
    - scenarios/train/train_narrow.json   # train seed range, rate 0.25. Built by
    - scenarios/train/train_medium.json   #   scripts/build_scenario_sets.py once its size is
    - scenarios/train/train_wide.json     #   preregistered; train.py refuses until they exist
