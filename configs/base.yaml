  # RE-FROZEN 2026-10-21, eighth time (was 42816b7c...): A24 -- the receding release (certified.py),
  # a blocking defect under the freeze of 2026-10-20 (ruled 2026-10-21); reward.py's docstring.
  # Without a creep stop the layer is bit-identical to A22's (tests/test_receding_release.py);
