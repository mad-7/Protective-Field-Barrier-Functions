  # by a noise-level amount.
  # RE-FROZEN 2026-10-18, fifth time (was 968d88af...): the simulator client raises SimError when
  # an instance does not reply within sim.reply_timeout_s, instead of waiting forever (client.py;
  # the B1 evaluation of 2026-10-17 stalled silently in a host memory exhaustion; hard rule 9). No
  # behaviour change while the instance answers. The filter-off bit-identity test reruns.
  # RE-FROZEN 2026-10-18, sixth time (was cc233459...): A20 -- the protective field contains the
  # motion reachable before braking acts (certified.py; strata.py derives the reach parameters),
  # and the generator's validity check tracks at band 0's speed limit (scenarios.py). A filter-off
  # BEHAVIOUR change by design (fields, limits and bands all moved); the bit-identity test reruns.
  # RE-FROZEN 2026-10-19, seventh time (was cb9c839c...): A21 -- nesting for stops begun in motion
