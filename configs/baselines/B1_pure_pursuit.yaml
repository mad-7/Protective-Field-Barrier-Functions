# B1 holonomic Pure Pursuit: parameters, the single source (loaded into cfg['baselines']['pure_pursuit'] by
# load_config through `baseline_files` in configs/base.yaml). Tuned values were written here by
# hand after the tuning run's review. Evaluate: python scripts/evaluate.py --config
# configs/base.yaml --seed <n> --controller pure_pursuit [--pfb on]
controller: pure_pursuit
base_key: pure_pursuit
params:
  cruise_speed: 0.4414254516786892  # m/s, translation toward the lookahead point (0.15-0.50)
  k_omega: 2.048573434083108  # 1/s, yaw rate per radian of lookahead bearing (0.5-3.0, log)
  goal_slowdown: 0.4774009708433046  # m, within this distance of the goal the speed falls linearly (0.25-1.2)
  lookahead: 0.343435717305025  # m of route arc, B1's OWN fixed lookahead
