# Corrected two-level calibration and power for H1 and H2 (supervisor's rulings, 2026-10-03).
# Seed-level variance x K/(K-1), t quantiles, Welch-Satterthwaite df. Nothing measured is restated:
# route lengths from the pilot set; alpha, comparators and the Holm family from endpoints.yaml.
defaults: ../base.yaml

power_corrected:
  seed_counts: [5, 10, 15, 20]        # corrected two-level candidates, seeds per learned arm:
                                      #   10 = branch 1 of the decision tree; <= 20 = branch 2
  policy_scoped_seeds: 5              # T1, reported in every case
  classical_df: flat_k_minus_1       # learned vs classical df (ruled 2026-10-03): WS if it passes
                                      #   calibration across the grid, else flat K-1. WS FAILED
                                      #   (CORRECTED_20261003T153838Z: L5's side, rate 10, seed CV
                                      #   0.5), so the fallback is in force.
  min_power: 0.80
  calibration:
    reps: 10000
    tolerance_mc_se: 3.0              # the ruled gate: at most nominal + 3 MC SE on each side
    extra_seed_cv: [0.0]              # also where T1's own null holds (H1)
    extra_seed_sd: [0.0]              # likewise for H2
  h1:
    sizes_per_cell: [50, 75, 100]     # pairs = size x the number of strata (H1 pools them)
    comparator_rates_per_100m: [2, 5, 10]
    l5_ratio: 0.7
    difficulty_cv: [0.5, 1.0, 1.5]
    seed_cv: [0.15, 0.3, 0.5]
    classical: [B1, B2, B3, B6]          # A16: B4 retired (= B1), B6 MPPI
    learned: [L1, L2, L3]
    secondary_other_ratio_to_l5: 2.0
    route_lengths_from: scenarios/pilot/pilot_narrow.json
    reps: 4000
    middle_point: {comparator_rate_per_100m: 5, difficulty_cv: 1.0, seed_cv: 0.3,
                   scenario: all_at_margin}
  h2:
    sizes_per_cell: [50, 75, 100]     # pairs = size x 2: the narrow stratum, mapped_only and
    cells_pooled: 2                   #   unmapped_static pooled (endpoints.yaml)
    l4_success_ranges:                # per scenario, uniform (ruled 2026-10-03): the 2026-09-29
      - [0.3, 0.8]                    #   model, and a low-baseline condition
      - [0.05, 0.40]
    effects: [0.15, 0.20, 0.25]       # L5 - L4, probability scale
    seed_logit_sd: [0.15, 0.3, 0.5, 1.0]   # per-seed logit shift, constant across scenarios
                                      #   (ruled; 1.0 because v1 seeds were near-bimodal)
    min_difference: 0.15              # H2's success: difference >= +15 pp AND significant
    reps: 4000
    # H2's middle point (ruled 2026-10-03): +20 pp, baseline [0.3, 0.8], seed SD = the measured
    # upper 80 % bound on the logit scale from the tune set. Until it is measured the grid is
    # reported with NO decisive cell.
